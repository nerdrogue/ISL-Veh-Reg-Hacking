name: Cross-Compile for Windows and Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: isl-veh-reg-hacking
            artifact_suffix: ""
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            artifact_name: isl-veh-reg-hacking.exe
            artifact_suffix: .exe
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross-compilation tools (Windows target)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 mingw-w64-tools
      
      - name: Install musl tools (Linux target)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
      
      - name: Build with optimization and LTO
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -Z build-std=std,panic_abort \
            -Z unstable-options
        env:
          RUSTFLAGS: "-C opt-level=3 -C lto=fat -C codegen-units=1"
          CARGO_CFG_TARGET_FEATURE: "+crt-static"
      
      - name: Strip binary (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: strip target/${{ matrix.target }}/release/isl-veh-reg-hacking || true
      
      - name: Strip binary (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          x86_64-w64-mingw32-strip target/${{ matrix.target }}/release/isl-veh-reg-hacking.exe || true
      
      - name: Create release directory
        run: |
          mkdir -p release/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release/${{ matrix.target }}/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          path: release/${{ matrix.target }}/${{ matrix.artifact_name }}
      
      - name: Display binary info
        run: |
          echo "=== Build Info for ${{ matrix.target }} ==="
          file release/${{ matrix.target }}/${{ matrix.artifact_name }} || true
          ls -lh release/${{ matrix.target }}/${{ matrix.artifact_name }}
